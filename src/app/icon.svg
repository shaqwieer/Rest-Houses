<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Rihla">
  <!--
    The browser-tab icon: the square Rihla mark, straight from the brand asset
    in public/ (the gold-on-white "copy-15" cut).

    Next's App Router picks this file up by name — `app/icon.svg` — and emits
    the <link rel="icon"> itself, which is why nothing in layout.tsx mentions
    it. Adding `metadata.icons` by hand would produce a second, competing tag.

    ─── Why the white ground stays ─────────────────────────────────────────────
    A transparent favicon is drawn straight onto the browser's own chrome, and
    this mark is a thin gold outline: on a dark tab strip it very nearly
    disappears. The white square is what gives it something to sit on, in both
    light and dark browsers.

    ─── Why the mark and not the wordmark ──────────────────────────────────────
    The other two brand files ("copy-21"/"copy-22") are the horizontal lockup.
    They are also 1200×1200, so they look like candidates — but the type in them
    is unreadable by the time it is scaled to the 16px a tab actually renders.
    A favicon has room for a mark and nothing else.
  -->
  <rect width="1200" height="1200" fill="#FFFFFF"/>
  <g fill="#C9A44C">
    <path d="M1032.27,1050H167.73V582.26C167.73,343.91,361.65,150,600,150s432.27,193.91,432.27,432.26V1050z
      M224.88,992.85h750.24V582.26c0-206.84-168.28-375.11-375.12-375.11S224.88,375.43,224.88,582.26V992.85z"/>
    <polygon points="898.66,814.89 832.48,861.98 975.13,965.53 975.13,992.85 915.69,992.85 600,763.91 284.31,992.85
      224.87,992.85 224.87,965.42 370.72,859.58 310.48,814.89 224.87,875.69 224.87,805.63 311.17,744.37 419.3,824.37 600,693.27
      783.68,826.55 899.35,744.37 975.13,800.49 975.13,871.46"/>
    <path d="M613.95,626.49h241.94c-28.62-44.25-78.3-73.61-134.91-73.61c-32.07,0-61.89,9.43-86.94,25.63l142.82-142.83
      c-51.53-11.05-107.41,3.32-147.45,43.35c-12.34,12.34-21.94,26.29-29.41,41.04c-7.47-14.75-17.07-28.71-29.41-41.04
      c-40.04-40.04-95.92-54.4-147.45-43.35l142.82,142.83c-25.05-16.2-54.88-25.63-86.94-25.63c-56.62,0-106.3,29.36-134.91,73.61
      h241.94H613.95z"/>
    <rect x="571.48" y="657.07" width="57.15" height="335.81"/>
    <rect x="698.44" y="676.47" transform="matrix(0.9999 -0.0137 0.0137 0.9999 -9.5677 10.4039)" width="115.57" height="57.15"/>
    <polygon points="385.61,734.89 505.1,735.13 505.1,677.99 385.83,677.75"/>
  </g>
</svg>
